# Render Blueprint. Review the paid service/disk costs before creating it.
# APP_URL is optional: the server uses Render's RENDER_EXTERNAL_URL automatically.
services:
  - type: web
    name: founders-morning
    runtime: node
    plan: starter
    branch: main
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/session
    disk:
      name: founders-morning-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: RESEARCH_API_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
