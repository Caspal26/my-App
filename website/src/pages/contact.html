<!--meta
{"title":"Contact us","description":"Contact OMC Advocates: send us a message, call or visit our office.","section":"contact","heroTitle":"Contact us","heroIntro":"Tell us briefly about your matter and the right member of our team will get back to you.","heroImage":"hero-skyline.svg","crumbs":[["Contact",null]]}
-->
<div class="contact-grid">
  <section aria-labelledby="form-h">
    <h2 class="section-title" id="form-h" style="margin-bottom:12px">Send us a message</h2>
    <p style="color:var(--muted);margin-bottom:28px">Please do not include confidential details until we have confirmed that we can act for you.</p>
    <div id="form-status" class="form-status" role="status" tabindex="-1" hidden></div>
    <form id="contact-form" action="{{root}}contact.php" method="post" novalidate>
      <div class="form-row">
        <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="120"></div>
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="phone">Phone number <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
        <div class="field"><label for="topic">How can we help?</label><select id="topic" name="topic">{{@contactTopics}}</select></div>
      </div>
      <div class="field"><label for="message">Your message</label><textarea id="message" name="message" rows="7" required maxlength="5000"></textarea></div>
      <div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <input type="hidden" name="started" value="">
      <div class="field"><label class="check"><input type="checkbox" name="consent" value="yes" required> <span>I agree that {{firm.name}} may use these details to respond to my enquiry, as described in the <a href="{{root}}privacy.html">privacy notice</a>.</span></label></div>
      <button class="btn" type="submit">Send message</button>
    </form>
  </section>

  <aside class="details" aria-labelledby="details-h">
    <h2 id="details-h">Our office</h2>
    <h3>Address</h3>
    <p>{{@address}}</p>
    <h3>Telephone</h3>
    <p>{{@phone}}</p>
    <h3>Email</h3>
    <p>{{@email}}</p>
    <h3>Office hours</h3>
    <p>{{@hours}}</p>
    {{@map}}
  </aside>
</div>
